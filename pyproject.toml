[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionvla"
version = "0.1.0"
description = "Typed robot decisions, native diffusion and probability diagnostics with DiffusionGemma"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "torch==2.9.1", "torchvision==0.24.1", "transformers==5.20.2",
  "numpy==2.5.4", "Pillow==13.0.0", "h5py==3.15.1", "safetensors==0.8.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decisionvla = ["*.c", "native_canvas.json"]
"decisionvla.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
